[package]
name = "elysia_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

# tijd + serde nodig
chrono = { version = "0.4", features = ["serde"] }

# uuid nodig
uuid = { version = "1", features = ["v4", "serde"] }

