# =====================================================================
# 📍 FILE: elysia/modules/marthe/Cargo.toml
#
# 📝 BESCHRIJVING:
#   De manifest van de MARTHE module. Dit is een ELYSIA plugin-crate.
#
# 🔧 TAKEN:
#   - Registreert zich automatisch als module via inventory
#   - Implementeert ElysiaModule
#   - Wordt gediscovered door de kernel zonder hard-coding
# =====================================================================
[package]
name = "marthe"
version = "0.1.0"
edition = "2024"

[dependencies]
elysia_core = { path = "../../elysia_core" }
inventory = "0.1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[lib]
crate-type = ["rlib"]

[package.metadata.inventory]
