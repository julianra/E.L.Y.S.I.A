# ======================================================================
# 📍 FILE: elysia_ai/Cargo.toml
#
# 📝 BESCHRIJVING:
#   Cargo-configuratie van de ELYSIA AI-kernel crate.
#   Wordt gebruikt door elysia_core en alle modules die AI nodig hebben.
#
# 🔧 TAKEN:
#   - Declareert deze crate als library
#   - Definieert dependencies (reqwest, serde_json, async-trait, thiserror)
#   - Wordt automatisch meegenomen in de workspace
#
# ======================================================================

[package]
name = "elysia_ai"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"

thiserror = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
