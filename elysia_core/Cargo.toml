# ======================================================================
# 📍 FILE: elysia_core/Cargo.toml
#
# 📝 Beschrijving:
#   Dependency set voor ELYSIA Core 2.0.
#   Uitgebreid met security/auth dependencies:
#     - argon2    → password hashing
#     - rand_core → randomness voor salts
#     - hmac      → HMAC-SHA256 tokens
#     - sha2      → SHA256 (basis voor HMAC)
#     - hex       → hex-encoding van signatures
# ======================================================================

[package]
name = "elysia_core"
version = "0.1.0"
edition = "2024"

[dependencies]
# Logging
log = "0.4"
env_logger = "0.11"

# Async + HTTP
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json", "macros"] }

# JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Systeem info
num_cpus = "1.16"
sysinfo = "0.30"

# Unieke node ID
uuid = { version = "1", features = ["v4"] }

# mDNS
mdns-sd = "0.7"
local-ip-address = "0.5"

# ❗ DATABASE (de correcte, conflictvrije versie)
rusqlite = { version = "0.30", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.23"

# Module auto-load
inventory = "0.1"

# Error handling
anyhow = "1.0"
dirs = "5.0"

# 🔐 AUTH / SECURITY
argon2 = "0.5"
rand_core = "0.6"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[lib]
crate-type = ["rlib", "dylib"]
