# ================================================================
# 📍 FILE: elysia/elysia_core/Cargo.toml
#
# 📝 BESCHRIJVING:
#   De Cargo-manifest van de ELYSIA Core library crate.
#   Dit is de motor van het systeem (eventbus, router, kernel).
#
# 🔧 TAKEN:
#   - Compileert de core als library
#   - Geeft kernel toegang tot AI, DB, eventbus, modules
# ================================================================

[package]
name = "elysia_core"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4"
env_logger = "0.11"
thiserror = "1"

# Inventory module registratie
inventory = { version = "0.1"}


# SQLite + pool
rusqlite = { version = "0.29", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.22"

dirs = "5.0"
mdns-sd = "0.7"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
local-ip-address = "0.5"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

elysia_ai = { path = "../elysia_ai" }


[lib]
proc-macro = false
crate-type = ["rlib", "dylib"]

[package.metadata.inventory]
